name: Build NEXCODE APK

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      build_variant:
        description: "Variante à compiler (debug / release / all)"
        required: false
        default: "all"

# Un seul build à la fois par branche : les pushs rapprochés annulent le run obsolète
# (un run complet coûte plusieurs minutes ; annuler économise du temps de runner).
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    # Écriture au dépôt requise pour publier la GitHub Release lors d'un tag v*.
    # (GITHUB_TOKEN est automatiquement limité à ce périmètre.)
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # Cache Gradle dédié : wrapper + dépendances + build cache + configuration cache.
      # Le « cache: gradle » de setup-java ne couvrait pas tout et chaque run
      # re-téléchargeait des dépendances (~1 min par run économisée).
      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew || true

      - name: Decode release keystore from secrets
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > my-upload-key.jks

      # Stratégie de variantes :
      # - push sur main/master/PR : assembleDebug + tests unitaires (retour rapide,
      #   ~1 seule compilation Kotlin au lieu de deux).
      # - déclenchement manuel : variante au choix (debug / release / all).
      # - tag v* : assembleRelease (keystore décodé + secrets) pour publier.
      - name: Determine build variant
        id: variant
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ github.event.inputs.build_variant }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "value=debug" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "value=release" >> $GITHUB_OUTPUT
          else
            echo "value=debug" >> $GITHUB_OUTPUT
          fi

      # Garde-fou release : le tag v* doit correspondre à la versionName de l'app.
      # Comparaison sur 3 segments (v1.0 ↔ versionName 1.0 accepté ; v1.2 ↔ 1.0 refusé),
      # sinon on publierait une release dont la version interne ne colle pas au tag
      # et le comparateur de versions de l'app (AppUpdateManager) se tromperait.
      - name: Check tag matches app version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          APP_VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          pad() { local v="$1"; while [ "$(printf '%s' "$v" | tr -cd . | wc -c)" -lt 2 ]; do v="$v.0"; done; printf '%s' "$v"; }
          if [ "$(pad "$TAG_VERSION")" != "$(pad "$APP_VERSION")" ]; then
            echo "::error::Le tag ${GITHUB_REF_NAME} ne correspond pas à versionName=\"${APP_VERSION}\" (app/build.gradle.kts). Bump la version puis re-tag."
            exit 1
          fi
          echo "Tag ${GITHUB_REF_NAME} ✔ cohérent avec versionName=${APP_VERSION}"

      # UNE seule invocation Gradle pour compiler + tester : le second appel
      # (« ./gradlew testDebugUnitTest » séparé) re-payait la configuration et
      # le redémarrage du daemon (~40 s par run économisés).
      - name: Build APKs and run unit tests
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          case "${{ steps.variant.outputs.value }}" in
            debug)   ./gradlew assembleDebug testDebugUnitTest --console=plain ;;
            release) ./gradlew assembleRelease --console=plain ;;
            *)       ./gradlew assembleDebug assembleRelease testDebugUnitTest --console=plain ;;
          esac

      # En cas d'échec : rapports de test complets (messages + stacks) pour le diagnostic
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
          retention-days: 7

      - name: Upload Debug APK Artifact
        if: ${{ steps.variant.outputs.value != 'release' }}
        uses: actions/upload-artifact@v4
        with:
          name: nexcode-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Upload Release APK Artifact
        if: ${{ steps.variant.outputs.value != 'debug' }}
        uses: actions/upload-artifact@v4
        with:
          name: nexcode-release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 90

      # PUBLICATION DE LA RELEASE (tag v* uniquement) :
      # c'est la source du système de mise à jour intégré à l'app, qui interroge
      # https://api.github.com/repos/kidasniger/Nexcode/releases/latest et télécharge
      # l'asset APK attaché à la release la plus récente. Sans cette étape, aucun APK
      # n'apparaît dans l'onglet « Releases » et l'updater renvoie 404.
      # Les lignes « Commit / Version Code / Version Name / Date » servent de
      # métadonnées lisibles sur GitHub ; AppUpdateManager.formatReleaseNotes les
      # retire automatiquement pour n'afficher que les points de nouveautés.
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -n1)
          cp "$APK" "Nexcode-${VERSION}.apk"
          VERSION_CODE=$(grep -oP 'versionCode\s*=\s*\K[0-9]+' app/build.gradle.kts)
          APP_VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)

          {
            echo "Commit: ${{ github.sha }}"
            echo "Version Code: ${VERSION_CODE}"
            echo "Version Name: ${APP_VERSION}"
            echo "Date: $(date -u '+%Y-%m-%d %H:%M UTC')"
            echo ""
            echo "## Installation"
            echo "- Télécharger **Nexcode-${VERSION}.apk** ci-dessous puis l'installer sur l'appareil."
            echo "- APK signé avec le keystore de release dédié (mises à jour futures installables directement depuis l'app)."
            echo ""
            echo "## Nouveautés"
            echo "- Nexcode ${APP_VERSION} : première version officielle."
            echo "- Mises à jour intégrées : Paramètres → Rechercher les mises à jour détecte, télécharge et installe les prochaines versions."
          } > release_notes.md

          gh release create "$VERSION" "Nexcode-${VERSION}.apk" \
            --title "Nexcode ${APP_VERSION}" \
            --notes-file release_notes.md \
            --verify-tag --latest
          echo "Release ${VERSION} publiée avec l'asset Nexcode-${VERSION}.apk"
